<p-toast></p-toast>
<div class="grid">
    <div class="col-12 md:col-4">
        <div class="card p-fluid">
            <h5><span class="red-dot-logo mr-2"></span>Nuevo Reporte</h5>
            <div class="field">
                <label>¿Qué sucedió?</label>
                <input pInputText type="text" [(ngModel)]="nuevoBug.titulo" placeholder="Describa el error..." />
            </div>
            <div class="field">
                <label>Estado</label>
                <p-dropdown [options]="estados" [(ngModel)]="nuevoBug.estado"></p-dropdown>
            </div>
            <button pButton label="Registrar Tarea" icon="pi pi-bolt" (click)="agregarBug()"></button>
        </div>
    </div>

    <div class="col-12 md:col-8">
        <div class="card">
            <h5><i class="pi pi-database mr-2"></i>Bugs en MongoDB</h5>
            <p-table [value]="bugs" [rows]="5" [paginator]="true" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-bug>
                    <tr>
                        <td>{{bug.titulo}}</td>
                        <td><span class="customer-badge status-new">{{bug.estado}}</span></td>
                        <td>
                            <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text" (click)="eliminarBug(bug._id)"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
